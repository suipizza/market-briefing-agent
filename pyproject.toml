[project]
name = "market-briefing-agent"
version = "0.2.0"
description = "Daily BTC market briefing agent: collect, tag, interpret, write to Notion"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.32",
    "python-dotenv>=1.0",
    "pandas>=2.2",
    "yfinance>=0.2.50",
    "pandas_market_calendars>=4.4",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
